name: Luzhanqi
options:
  bundleIdPrefix: com.bengee
  deploymentTarget:
    iOS: "17.0"
packages:
  LuzhanqiKit:
    path: Packages/LuzhanqiKit
targets:
  Luzhanqi:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: RULES.md
        buildPhase: resources
      - path: RULES.zh.md
        buildPhase: resources
    dependencies:
      - package: LuzhanqiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bengee.Luzhanqi
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 陆战棋
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  LuzhanqiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Luzhanqi
      - package: LuzhanqiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bengee.LuzhanqiTests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Luzhanqi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Luzhanqi"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LuzhanqiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Luzhanqi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bengee.LuzhanqiUITests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Luzhanqi
schemes:
  Luzhanqi:
    build:
      targets:
        Luzhanqi: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LuzhanqiKit/LuzhanqiKitTests
        - LuzhanqiTests
        - LuzhanqiUITests
